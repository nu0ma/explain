name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Check that the committed bundle matches the build
        run: git diff --exit-code -- skills/explain/scripts/explain.mjs
      - run: pnpm test

  # The browser, speech, and MP4 export tests need Chrome, macOS say, and ffmpeg, so they run on macOS.
  # Every test must run here: a skip means a dependency is missing and the video output went unchecked.
  e2e:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Run all tests with EXPLAIN_E2E=1 and fail on any skip
        env:
          EXPLAIN_E2E: '1'
        run: |
          set -o pipefail
          node --test --test-reporter=tap "test/*.test.ts" | tee e2e.tap
          grep -q '^# skipped 0$' e2e.tap || { echo "::error::Some tests were skipped in the E2E job"; grep -E '# SKIP' e2e.tap; exit 1; }

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
      - name: Install ghalint and verify its checksum
        env:
          GHALINT_VERSION: 1.5.4
          GHALINT_SHA256: 977555b7142cc057aad4663679772510a9ed3f1687f26f2359d18bb6b67314fe
        run: |
          archive="ghalint_${GHALINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/suzuki-shunsuke/ghalint/releases/download/v${GHALINT_VERSION}/${archive}"
          echo "${GHALINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" ghalint
      - run: '"$RUNNER_TEMP/ghalint" run'
