name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Render examples
        run: |
          for f in examples/*.md; do
            node dist/explain.mjs render "$f" --no-open -o "out/$(basename "$f" .md).html"
            node dist/explain.mjs render "$f" --no-open --static -o "out/$(basename "$f" .md).static.html"
          done
