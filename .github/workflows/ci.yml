name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Check that the committed bundle matches the build
        run: git diff --exit-code -- skills/explain/scripts/explain.mjs
      - run: pnpm test

  # The browser, speech, and MP4 export tests need Chrome, macOS say, and ffmpeg, so they run on macOS.
  # Every test must run here: a skip means a dependency is missing and the video output went unchecked.
  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Run all tests with EXPLAIN_E2E=1 and fail on any skip
        env:
          EXPLAIN_E2E: '1'
        run: |
          set -o pipefail
          node --test --test-reporter=tap "test/*.test.ts" | tee e2e.tap
          grep -q '^# skipped 0$' e2e.tap || { echo "::error::Some tests were skipped in the E2E job"; grep -E '# SKIP' e2e.tap; exit 1; }
